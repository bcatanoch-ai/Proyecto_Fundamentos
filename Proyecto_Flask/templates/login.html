            <a href="../paginas/carrito.html" class="option">Carrito</a>

    </header>

    
    <nav class="sub_menu">
        <ul>
            <li class="dropdown">
                <a href="../paginas/consola.html" class="dropbtn">Consolas</a>
                <ul class="dropdown-content">

    <main class="contenedor-login">
        <div class="caja-login">
            <h1>Inicio de Sesión</h1>
            <p>Inicie sesión con su correo electrónico.</p>
            
            <form action="#">
                <div class="grupo-input">
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" required>
                </div>

                <a href="#" class="olvido-pass">¿Olvidó su contraseña?</a>

                <button type="submit" id="btn_entrar" class="btn-principal">INICIAR SESIÓN</button>
                <button type="button" id="btn_registrar" class="btn-secundario">CREAR UNA CUENTA</button>
            </form>
            
            <p class="nota">* Campos obligatorios</p>
        </div>
    </main>
    <script src="../js/script.js"></script>
